[package]
name = "vacp2p_pmtree"
version = "3.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Persistent Merkle Tree in Rust"

[dependencies]
rayon = { version = "1.12.0", optional = true }
parking_lot = "0.12.5"
thiserror = "2.0.18"

[dev-dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
hex-literal = "1.1.0"
sled = "0.34.7"

[features]
default = []
parallel = ["rayon"]
