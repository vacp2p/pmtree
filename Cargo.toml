[package]
name = "vacp2p_pmtree"
version = "2.0.4"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Persistent Merkle Tree in Rust"

[dev-dependencies]
hex-literal = "1.1.0"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
sled = "=0.34.7"

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
default = []
parallel = ["rayon"]
